name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  pr-info:
    name: PR Analysis
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze
        run: |
          npm run build 2>&1 | tee build-output.txt

          # Extract bundle sizes
          echo "## Build Analysis" > analysis.md
          echo "" >> analysis.md
          echo "### Bundle Sizes" >> analysis.md
          echo "\`\`\`" >> analysis.md
          grep -E "dist/.*\.(js|css)" build-output.txt | head -10 >> analysis.md || echo "No bundle info found" >> analysis.md
          echo "\`\`\`" >> analysis.md

          # Count files
          echo "" >> analysis.md
          echo "### Build Stats" >> analysis.md
          echo "- **Total files:** $(find dist -type f | wc -l)" >> analysis.md
          echo "- **JavaScript files:** $(find dist -name '*.js' | wc -l)" >> analysis.md
          echo "- **CSS files:** $(find dist -name '*.css' | wc -l)" >> analysis.md
          echo "- **Total size:** $(du -sh dist | cut -f1)" >> analysis.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('analysis.md', 'utf8');

            const body = `## Build Status: Success

            ${analysis}

            ---
            *Automated check by GitHub Actions*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Build Status')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Check for secrets
        run: |
          # Simple check for common secret patterns
          if grep -rE "(password|secret|api_key|apikey|token).*=.*['\"][^'\"]{8,}" --include="*.ts" --include="*.tsx" --include="*.js" src/ 2>/dev/null; then
            echo "::warning::Potential hardcoded secrets found. Please review."
          fi
