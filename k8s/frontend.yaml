---
# ConfigMap for nginx configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: amss-frontend-nginx-config
  namespace: amss-uat
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

        # Handle SPA routing - all routes go to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets (1 year)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amss-frontend
  namespace: amss-uat
  labels:
    app: amss-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amss-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: amss-frontend
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: frontend-files
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: frontend-files
        hostPath:
          path: /var/www/amss
          type: Directory
      - name: nginx-config
        configMap:
          name: amss-frontend-nginx-config

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: amss-frontend
  namespace: amss-uat
  labels:
    app: amss-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: amss-frontend

---
# Ingress with SSL
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amss-frontend
  namespace: amss-uat
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Optional: Add rate limiting
    # nginx.ingress.kubernetes.io/limit-rps: "10"
    # Optional: Add CORS headers
    # nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - amss.leoulgirma.com
    secretName: amss-frontend-tls
  rules:
  - host: amss.leoulgirma.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: amss-frontend
            port:
              number: 80
